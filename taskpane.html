<!doctype html><html lang=vi><head><meta charset=UTF-8><meta http-equiv=X-UA-Compatible content="IE=Edge"><title>Căn chỉnh văn bản</title><script src=https://appsforoffice.microsoft.com/lib/1/hosted/office.js></script><style>:root{--bg:#faf9f5;--surface:#ffffff;--border:#e8e5de;--text:#262624;--text-muted:#83827d;--accent:#cc785c;--accent-hover:#b35f45;--accent-soft:#f5ebe6;--success-bg:#eaf4ea;--success-text:#2f6f3e;--error-bg:#fbeaea;--error-text:#b3261e}*{box-sizing:border-box}body{font-family:Cambria,Times New Roman,Georgia,serif;margin:0;padding:16px;color:var(--text);background:var(--bg);font-size:13px;line-height:1.45}header{display:flex;align-items:center;gap:10px;margin-bottom:4px}.logo-dot{width:20px;height:20px;min-width:20px;border-radius:6px;background:var(--accent)}h1{font-size:16px;font-weight:600;margin:0;letter-spacing:-.01em}section{margin-top:14px;margin-bottom:14px;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px 14px 12px;box-shadow:0 1px 2px#26262408}section h2{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--accent);margin:0 0 10px}button{display:flex;align-items:center;gap:8px;width:100%;text-align:left;padding:8px 10px;margin-bottom:6px;border:1px solid var(--border);border-radius:8px;background:var(--surface);color:var(--text);font-size:12.5px;font-family:inherit;cursor:pointer;transition:background.12s,border-color.12s}button:last-child{margin-bottom:0}button:hover{background:var(--accent-soft);border-color:var(--accent)}button:active{background:#ecdcd3}button.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}button.primary:hover{background:var(--accent-hover);border-color:var(--accent-hover)}button .icon{width:15px;height:15px;min-width:15px;color:var(--accent)}button.primary .icon{color:#fff}button span{overflow-wrap:anywhere}.row{display:flex;gap:6px}.row button{flex:1;margin-bottom:0}.row+.row,.row+button{margin-top:6px}input[type=text]{display:block;width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:8px;background:var(--surface);color:var(--text);font-size:13px;font-family:inherit}.row input[type=text]{flex:1.6;margin-bottom:0}input[type=text]:focus{outline:none;border-color:var(--accent)}#status{min-height:20px;font-size:12.5px;padding:10px 12px;border-radius:10px;background:var(--surface);border:1px solid var(--border);color:var(--text-muted);white-space:pre-wrap}#status.error{background:var(--error-bg);border-color:var(--error-bg);color:var(--error-text)}#status.success{background:var(--success-bg);border-color:var(--success-bg);color:var(--success-text)}</style><script defer src=taskpane.js></script></head><body><header><div class=logo-dot></div><h1>Căn chỉnh văn bản hành chính</h1></header><section><h2>1. Định dạng trang</h2><button id=btn-page-setup class=primary><svg class=icon viewBox="0 0 16 16" fill=none stroke=currentColor stroke-width=1.4 stroke-linecap=round stroke-linejoin=round><rect x=2 y=1.5 width=12 height=13 rx=1.2 /><rect x=4.6 y=4 width=6.8 height=8 stroke-dasharray="1.6 1.6"/></svg> <span>Chuẩn hoá lề trang</span></button> <button id=btn-unify-font><svg class=icon viewBox="0 0 16 16"><text x=1 y=12.5 font-size=12 font-family="Georgia, serif" fill=currentColor>Aa</text></svg> <span>Đồng bộ font Times New Roman</span></button><div class=row><button id=btn-insert-landscape><svg class=icon viewBox="0 0 16 16" fill=none stroke=currentColor stroke-width=1.4 stroke-linecap=round stroke-linejoin=round><rect x=1.5 y=4 width=13 height=8 rx=1.1 /></svg> <span>Trang ngang</span></button> <button id=btn-insert-portrait><svg class=icon viewBox="0 0 16 16" fill=none stroke=currentColor stroke-width=1.4 stroke-linecap=round stroke-linejoin=round><rect x=4 y=1.5 width=8 height=13 rx=1.1 /></svg> <span>Trang dọc</span></button></div></section><section><h2>2. Chèn nội dung mẫu</h2><div class=row><button id=btn-insert-quochieu><svg class=icon viewBox="0 0 16 16" fill=currentColor><path d="M8 1.4l1.9 3.9 4.3.6-3.1 3 .7 4.3L8 11.3l-3.8 1.9.7-4.3-3.1-3 4.3-.6L8 1.4z"/></svg> <span>Quốc hiệu – Tiêu ngữ</span></button> <button id=btn-insert-noinhan><svg class=icon viewBox="0 0 16 16" fill=none stroke=currentColor stroke-width=1.4 stroke-linecap=round stroke-linejoin=round><path d="M11.3 2.3l2.4 2.4L5 13.4l-3 .8.8-3 8.5-8.9z"/></svg> <span>Nơi nhận & chữ ký</span></button></div></section><section><h2>3. Định dạng bảng biểu</h2><div class=row><button id=btn-repeat-header><svg class=icon viewBox="0 0 16 16" fill=none stroke=currentColor stroke-width=1.3 stroke-linecap=round stroke-linejoin=round><rect x=1.5 y=2.5 width=13 height=11 rx=1 /><rect x=1.5 y=2.5 width=13 height=3.4 fill=currentColor stroke=none opacity=0.28 /><line x1=1.5 y1=9 x2=14.5 y2=9 /><line x1=5.7 y1=2.5 x2=5.7 y2=13.5 /><line x1=10.3 y1=2.5 x2=10.3 y2=13.5 /></svg> <span>Lặp tiêu đề bảng</span></button> <button id=btn-center-table><svg class=icon viewBox="0 0 16 16" fill=none stroke=currentColor stroke-width=1.4 stroke-linecap=round><line x1=2 y1=3 x2=14 y2=3 /><line x1=4.5 y1=6.4 x2=11.5 y2=6.4 /><line x1=2 y1=9.8 x2=14 y2=9.8 /><line x1=4.5 y1=13.2 x2=11.5 y2=13.2 /></svg> <span>Căn giữa trong bảng</span></button></div></section><section><h2>4. Định dạng đoạn văn</h2><div class=row><button id=btn-first-line-indent><svg class=icon viewBox="0 0 16 16" fill=none stroke=currentColor stroke-width=1.4 stroke-linecap=round><line x1=5.5 y1=3 x2=14 y2=3 /><line x1=2 y1=6.4 x2=14 y2=6.4 /><line x1=2 y1=9.8 x2=14 y2=9.8 /><line x1=2 y1=13.2 x2=14 y2=13.2 /></svg> <span>Thụt lề đầu dòng</span></button> <button id=btn-line-spacing><svg class=icon viewBox="0 0 16 16" fill=none stroke=currentColor stroke-width=1.4 stroke-linecap=round stroke-linejoin=round><line x1=5.5 y1=1.6 x2=5.5 y2=14.4 /><path d="M3.7 3.6L5.5 1.6l1.8 2M3.7 12.4l1.8 2 1.8-2"/><line x1=8.6 y1=4.2 x2=14 y2=4.2 /><line x1=8.6 y1=8 x2=14 y2=8 /><line x1=8.6 y1=11.8 x2=14 y2=11.8 /></svg> <span>Chuẩn hoá giãn dòng</span></button></div><button id=btn-cleanup><svg class=icon viewBox="0 0 16 16" fill=none stroke=currentColor stroke-width=1.4 stroke-linecap=round stroke-linejoin=round><path d="M9.3 2.2l4.5 4.5-6.3 6.3H4.4l-2-2L9.3 2.2z"/><line x1=5.9 y1=13 x2=13.6 y2=13 /></svg> <span>Xoá dấu cách thừa</span></button><div class=row><button id=btn-justify-selection><svg class=icon viewBox="0 0 16 16" fill=none stroke=currentColor stroke-width=1.4 stroke-linecap=round><line x1=2 y1=3 x2=14 y2=3 /><line x1=2 y1=6.4 x2=14 y2=6.4 /><line x1=2 y1=9.8 x2=14 y2=9.8 /><line x1=2 y1=13.2 x2=9 y2=13.2 /></svg> <span>Justify đoạn chọn</span></button> <button id=btn-justify-all><svg class=icon viewBox="0 0 16 16" fill=none stroke=currentColor stroke-width=1.4 stroke-linecap=round><line x1=2 y1=2.6 x2=14 y2=2.6 /><line x1=2 y1=5.6 x2=14 y2=5.6 /><line x1=2 y1=8.6 x2=14 y2=8.6 /><line x1=2 y1=11.6 x2=14 y2=11.6 /><line x1=2 y1=14.6 x2=9 y2=14.6 /></svg> <span>Justify toàn văn bản</span></button></div></section><section><h2>5. Đổi số thành chữ</h2><div class=row><input id=input-number placeholder="Ví dụ: 5.000.000"> <button id=btn-number-to-words class=primary><svg class=icon viewBox="0 0 16 16" fill=none stroke=currentColor stroke-width=1.4 stroke-linecap=round stroke-linejoin=round><path d="M2 5.5V2h3M2 5.5l3-3.5"/><path d="M13.2 3.2c.9 0 1.6.7 1.6 1.5 0 .5-.2.9-.7 1.3l-1.7 1.4h2.4"/><line x1=9 y1=11 x2=14.6 y2=11 /><line x1=9 y1=13.6 x2=14.6 y2=13.6 /></svg> <span>Tạo text</span></button></div></section><section><h2>6. Kiểm tra chính tả</h2><button id=btn-spellcheck class=primary><svg class=icon viewBox="0 0 16 16" fill=none stroke=currentColor stroke-width=1.4 stroke-linecap=round stroke-linejoin=round><circle cx=7 cy=7 r=5.2 /><line x1=10.8 y1=10.8 x2=14.5 y2=14.5 /></svg> <span>Kiểm tra chính tả (theo âm tiết)</span></button></section><div id=status>Sẵn sàng.</div><script src=taskpane.js></script></body></html>
