<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=Edge" />
  <title>Căn chỉnh văn bản</title>
  <script type="text/javascript" src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
  <style>
    :root {
      --bg: #faf9f5;
      --surface: #ffffff;
      --border: #e8e5de;
      --text: #262624;
      --text-muted: #83827d;
      --accent: #cc785c;
      --accent-hover: #b35f45;
      --accent-soft: #f5ebe6;
      --success-bg: #eaf4ea;
      --success-text: #2f6f3e;
      --error-bg: #fbeaea;
      --error-text: #b3261e;
    }
    * { box-sizing: border-box; }
    body {
      font-family: Cambria, "Times New Roman", Georgia, serif;
      margin: 0;
      padding: 8px 8px 0;
      color: var(--text);
      background: var(--bg);
      font-size: 12px;
      line-height: 1.35;
    }
    section {
      margin-top: 6px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 7px;
    }
    section h2 {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--accent);
      margin: 0 0 5px 1px;
    }
    button {
      display: flex;
      align-items: center;
      gap: 5px;
      width: 100%;
      min-width: 0;
      text-align: left;
      padding: 5px 7px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--surface);
      color: var(--text);
      font-size: 12px;
      font-family: inherit;
      cursor: pointer;
      transition: background 0.12s ease, border-color 0.12s ease;
    }
    button:hover { background: var(--accent-soft); border-color: var(--accent); }
    button:active { background: #ecdcd3; }
    button:disabled { opacity: 0.55; cursor: progress; }
    button.primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #ffffff;
      font-weight: 600;
    }
    button.primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
    button.quick { padding: 8px 10px; font-size: 13px; justify-content: center; }
    .row > button.narrow { flex: 0 0 auto; width: auto; }
    button .icon {
      width: 13px;
      height: 13px;
      min-width: 13px;
      color: var(--accent);
    }
    button.primary .icon { color: #ffffff; }
    button span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .row {
      display: flex;
      gap: 5px;
    }
    .row > * { flex: 1 1 0; min-width: 0; }
    .row + .row, .row + input { margin-top: 5px; }
    select, input[type="text"] {
      display: block;
      width: 100%;
      padding: 5px 7px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--surface);
      color: var(--text);
      font-size: 12px;
      font-family: inherit;
    }
    .chips { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 5px; }
    .chip { display: inline-flex; border: 1px solid var(--border); border-radius: 12px; overflow: hidden; background: var(--accent-soft); }
    .chip button { width: auto; border: 0; border-radius: 0; padding: 2px 7px; background: transparent; font-size: 11.5px; }
    .chip button:last-child { padding: 2px 6px; color: var(--text-muted); }
    .chip button:hover { background: #ecdcd3; }
    .chips + .row { margin-top: 5px; }
    #input-sign-name { margin-top: 5px; }
    #input-sign-name[hidden] { display: none; }
    select:focus, input[type="text"]:focus { outline: none; border-color: var(--accent); }
    #status {
      position: sticky;
      bottom: 0;
      margin: 6px -8px 0;
      min-height: 18px;
      font-size: 12px;
      padding: 7px 10px;
      background: var(--surface);
      border-top: 1px solid var(--border);
      color: var(--text-muted);
      white-space: pre-wrap;
    }
    #status.error { background: var(--error-bg); border-color: var(--error-bg); color: var(--error-text); }
    #status.success { background: var(--success-bg); border-color: var(--success-bg); color: var(--success-text); }
  </style>
<script defer src="taskpane.js"></script></head>
<body>
  <button id="btn-quick-normalize" class="primary quick" title="Lề trang, font, dấu cách thừa, căn đều, giãn dòng, thụt đầu dòng. Giữ nguyên bảng và đoạn căn giữa/căn phải."><svg class="icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 1.5L3.5 9H8l-1 5.5L12.5 7H8l1-5.5z"/></svg><span>Chuẩn hoá nhanh toàn văn bản</span></button>

  <section>
    <h2>Trang</h2>
    <div class="row">
      <button id="btn-page-setup" title="Chuẩn hoá lề: Trên 20 • Dưới 20 • Trái 30 • Phải 15 (mm)"><svg class="icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="1.5" width="12" height="13" rx="1.2"/><rect x="4.6" y="4" width="6.8" height="8" stroke-dasharray="1.6 1.6"/></svg><span>Lề trang</span></button>
      <button id="btn-unify-font" title="Đồng bộ toàn bộ font thành Times New Roman"><svg class="icon" viewBox="0 0 16 16"><text x="1" y="12.5" font-size="12" font-family="Georgia, serif" fill="currentColor">Aa</text></svg><span>Font Times</span></button>
    </div>
    <div class="row">
      <button id="btn-page-number" title="Đánh số trang theo NĐ 30: căn giữa phía trên, cỡ 14, không hiện số trang đầu (ghi đè header hiện có)"><svg class="icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="1.5" width="11" height="13" rx="1.2"/><path d="M7 3.6h2"/><path d="M5 7.5h6M5 10h6M5 12.5h4"/></svg><span>Đánh số trang</span></button>
    </div>
    <div class="row">
      <button id="btn-insert-landscape" title="Chèn thêm 1 trang ngang ở cuối văn bản"><svg class="icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><rect x="1.5" y="4" width="13" height="8" rx="1.1"/></svg><span>Trang ngang</span></button>
      <button id="btn-insert-portrait" title="Chèn thêm 1 trang dọc ở cuối văn bản"><svg class="icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="1.5" width="8" height="13" rx="1.1"/></svg><span>Trang dọc</span></button>
    </div>
  </section>

  <section>
    <h2>Chèn mẫu</h2>
    <div class="row">
      <button id="btn-insert-quochieu" title="Chèn Quốc hiệu – Tiêu ngữ ở đầu văn bản"><svg class="icon" viewBox="0 0 16 16" fill="currentColor"><path d="M8 1.4l1.9 3.9 4.3.6-3.1 3 .7 4.3L8 11.3l-3.8 1.9.7-4.3-3.1-3 4.3-.6L8 1.4z"/></svg><span>Quốc hiệu</span></button>
      <button id="btn-insert-noinhan" title="Chèn khối Nơi nhận và Chữ ký ở cuối văn bản"><svg class="icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M11.3 2.3l2.4 2.4L5 13.4l-3 .8.8-3 8.5-8.9z"/></svg><span>Nơi nhận, ký</span></button>
    </div>
    <div class="row">
      <select id="select-doc-type" title="Tên loại văn bản">
        <option>Tờ trình</option>
        <option>Báo cáo</option>
        <option>Kế hoạch</option>
        <option>Quyết định</option>
        <option>Thông báo</option>
        <option>Giấy mời</option>
        <option>Biên bản</option>
        <option>Phương án</option>
        <option>Chương trình</option>
      </select>
      <button id="btn-insert-doc-title" title="Chèn tên loại văn bản + trích yếu tại vị trí con trỏ"><svg class="icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><line x1="3" y1="3.5" x2="13" y2="3.5"/><line x1="4.5" y1="7" x2="11.5" y2="7"/><line x1="6.5" y1="11" x2="9.5" y2="11"/></svg><span>Chèn tiêu đề</span></button>
    </div>
    <input type="text" id="input-doc-summary" placeholder="Trích yếu (VD: Về việc...)" title="Trích yếu – để trống nếu không cần" />
  </section>

  <section>
    <h2>Bảng</h2>
    <div class="row">
      <button id="btn-repeat-header" title="Lặp lại hàng tiêu đề khi bảng sang trang (bỏ qua bảng Quốc hiệu, Nơi nhận)"><svg class="icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><rect x="1.5" y="2.5" width="13" height="11" rx="1"/><rect x="1.5" y="2.5" width="13" height="3.4" fill="currentColor" stroke="none" opacity="0.28"/><line x1="1.5" y1="9" x2="14.5" y2="9"/><line x1="5.7" y1="2.5" x2="5.7" y2="13.5"/><line x1="10.3" y1="2.5" x2="10.3" y2="13.5"/></svg><span>Lặp tiêu đề</span></button>
      <button id="btn-center-table" title="Căn giữa nội dung trong bảng (bỏ qua bảng Quốc hiệu, Nơi nhận)"><svg class="icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><line x1="2" y1="3" x2="14" y2="3"/><line x1="4.5" y1="6.4" x2="11.5" y2="6.4"/><line x1="2" y1="9.8" x2="14" y2="9.8"/><line x1="4.5" y1="13.2" x2="11.5" y2="13.2"/></svg><span>Căn giữa bảng</span></button>
    </div>
  </section>

  <section>
    <h2>Đoạn văn</h2>
    <div class="row">
      <button id="btn-first-line-indent" title="Thụt lề đầu dòng 1cm cho đoạn đang chọn"><svg class="icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><line x1="5.5" y1="3" x2="14" y2="3"/><line x1="2" y1="6.4" x2="14" y2="6.4"/><line x1="2" y1="9.8" x2="14" y2="9.8"/><line x1="2" y1="13.2" x2="14" y2="13.2"/></svg><span>Thụt đầu dòng</span></button>
      <button id="btn-line-spacing" title="Chuẩn hoá giãn dòng cho đoạn đang chọn"><svg class="icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><line x1="5.5" y1="1.6" x2="5.5" y2="14.4"/><path d="M3.7 3.6L5.5 1.6l1.8 2M3.7 12.4l1.8 2 1.8-2"/><line x1="8.6" y1="4.2" x2="14" y2="4.2"/><line x1="8.6" y1="8" x2="14" y2="8"/><line x1="8.6" y1="11.8" x2="14" y2="11.8"/></svg><span>Giãn dòng</span></button>
    </div>
    <div class="row">
      <button id="btn-justify-selection" title="Căn đều hai bên đoạn đang chọn"><svg class="icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><line x1="2" y1="3" x2="14" y2="3"/><line x1="2" y1="6.4" x2="14" y2="6.4"/><line x1="2" y1="9.8" x2="14" y2="9.8"/><line x1="2" y1="13.2" x2="9" y2="13.2"/></svg><span>Căn đều chọn</span></button>
      <button id="btn-justify-all" title="Căn đều hai bên toàn văn bản (không tính bảng)"><svg class="icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><line x1="2" y1="2.6" x2="14" y2="2.6"/><line x1="2" y1="5.6" x2="14" y2="5.6"/><line x1="2" y1="8.6" x2="14" y2="8.6"/><line x1="2" y1="11.6" x2="14" y2="11.6"/><line x1="2" y1="14.6" x2="9" y2="14.6"/></svg><span>Căn đều tất cả</span></button>
    </div>
    <div class="row">
      <button id="btn-cleanup" title="Gộp 2+ dấu cách liền nhau thành 1 trong toàn văn bản"><svg class="icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9.3 2.2l4.5 4.5-6.3 6.3H4.4l-2-2L9.3 2.2z"/><line x1="5.9" y1="13" x2="13.6" y2="13"/></svg><span>Xoá dấu cách thừa</span></button>
    </div>
  </section>

  <section>
    <h2>Ô ký số &amp; PDF</h2>
    <div class="row">
      <select id="select-sign-name" title="Tên trường chữ ký trong PDF"></select>
      <button id="btn-place-sign" class="narrow" title="Đặt ô ký tại vị trí con trỏ — hiện nhãn tên ô trên màn hình (không in, không vào PDF), lưu cùng file Word"><svg class="icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M8 2v12M2 8h12"/></svg><span>Đặt ô ký</span></button>
    </div>
    <input type="text" id="input-sign-name" hidden placeholder="Tên ô ký: chữ không dấu, số, _ (VD ct_pkd)" title="Tên trường chữ ký trong PDF: chữ không dấu, số, dấu gạch dưới" />
    <div id="sign-list" class="chips" hidden></div>
    <div class="row">
      <button id="btn-save-pdf" title="Xuất văn bản hiện tại thành file PDF (lưu vào thư mục Downloads)"><svg class="icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9.5 1.5H4a1 1 0 0 0-1 1v11a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1V5z"/><path d="M9.5 1.5V5H13"/><path d="M8 7.5v4.5M6 10l2 2 2-2"/></svg><span>Lưu PDF</span></button>
      <button id="btn-save-pdf-sign" title="Xuất PDF, mỗi ô ký đã đặt thành 1 trường chữ ký số mang đúng tên ô"><svg class="icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><rect x="1.5" y="4" width="13" height="8" rx="1" stroke-dasharray="2 1.5"/><path d="M4 10c1-2.5 2-2.5 2.5-1s1.5 1.5 2.5-1 2 0 3 0"/></svg><span>PDF có ô ký</span></button>
    </div>
  </section>

  <section>
    <h2>Đổi số thành chữ</h2>
    <div class="row">
      <input type="text" id="input-number" placeholder="VD: 5.000.000 hoặc 2,5" />
      <button id="btn-number-to-words" class="primary narrow" title="Chèn số dạng chữ vào vị trí con trỏ"><svg class="icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M2 5.5V2h3M2 5.5l3-3.5"/><path d="M13.2 3.2c.9 0 1.6.7 1.6 1.5 0 .5-.2.9-.7 1.3l-1.7 1.4h2.4"/><line x1="9" y1="11" x2="14.6" y2="11"/><line x1="9" y1="13.6" x2="14.6" y2="13.6"/></svg><span>Đổi</span></button>
    </div>
  </section>

  <div id="status">Sẵn sàng.</div>
</body>
</html>
